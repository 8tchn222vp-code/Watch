<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>時間計算機</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.app{width:min(100% - 28px,600px);margin:28px auto 40px}
h1{font-size:28px;margin:0 0 6px}.sub{color:#6b7280;margin:0 0 22px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 6px}.hint{font-size:13px;color:#6b7280;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
label{font-size:13px;color:#6b7280;display:block;margin-bottom:6px}
input{width:100%;min-height:50px;border:1px solid #d1d5db;border-radius:12px;padding:10px 14px;font-size:20px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}
.arrow{padding-bottom:14px;color:#6b7280}
button{min-height:48px;border:0;border-radius:12px;padding:0 16px;font-size:15px;cursor:pointer}
.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.result{margin-top:14px;font-size:27px;font-weight:700}
.error{min-height:19px;color:#dc2626;font-size:13px;margin-top:6px}
.rows{display:grid;gap:9px}.row{display:flex;gap:8px}.row input{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.remove{background:#e5e7eb;color:#374151;min-width:48px;padding:0 12px}
.note{font-size:13px;color:#6b7280;line-height:1.6;margin-top:12px}
@media(max-width:430px){.grid{grid-template-columns:1fr}.arrow{display:none}}
</style>
</head>
<body>
<main class="app">
<h1>時間計算機</h1>
<p class="sub">「:」なしで数字だけ入力して計算できます。</p>

<section class="card">
<h2>① 時刻の差を計算</h2>
<p class="hint">例：3時30分 → 5時00分なら「330」「500」</p>
<div class="grid">
<div><label for="start">開始時刻</label><input id="start" class="clock" inputmode="numeric" maxlength="4" placeholder="330"></div>
<div class="arrow">→</div>
<div><label for="end">終了時刻</label><input id="end" class="clock" inputmode="numeric" maxlength="4" placeholder="500"></div>
</div>
<div id="diffResult" class="result">0時間0分</div>
<div id="diffError" class="error"></div>
<p class="note">終了時刻が開始時刻より小さい場合は、自動的に翌日として計算します。例：2300 → 700 = 8時間。</p>
</section>

<section class="card">
<h2>② 日をまたぐ時間を計算</h2>
<p class="hint">開始・終了を入力するだけ。夜勤などの日またぎ計算用です。</p>
<div class="grid">
<div><label for="overnightStart">開始時刻</label><input id="overnightStart" class="clock overnight" inputmode="numeric" maxlength="4" placeholder="2300"></div>
<div class="arrow">→</div>
<div><label for="overnightEnd">終了時刻</label><input id="overnightEnd" class="clock overnight" inputmode="numeric" maxlength="4" placeholder="700"></div>
</div>
<div id="overnightResult" class="result">0時間0分</div>
<div id="overnightError" class="error"></div>
</section>

<section class="card">
<h2>③ 時間を合計</h2>
<p class="hint">例：「110」「030」「050」→ 2時間30分</p>
<div id="rows" class="rows"></div>
<div class="actions">
<button id="add" class="primary" type="button">＋ 時間を追加</button>
<button id="clear" class="secondary" type="button">クリア</button>
</div>
<div id="sumResult" class="result">0時間0分</div>
<div id="sumError" class="error"></div>
<p class="note">110 = 1時間10分 ／ 030 = 0時間30分 ／ 50 = 0時間50分</p>
</section>
</main>

<script>
(() => {
  const onlyDigits = input => input.value = input.value.replace(/\D/g,"");

  function parseClock(value){
    const s=value.trim();
    if(!s) return null;
    if(!/^\d{1,4}$/.test(s)) return undefined;
    const n=Number(s);
    const h=Math.floor(n/100), m=n%100;
    if(h>23 || m>59) return undefined;
    return h*60+m;
  }

  function clockDiff(start,end){
    let d=end-start;
    if(d<0) d+=1440;
    return d;
  }

  function formatMinutes(mins){
    return `${Math.floor(mins/60)}時間${mins%60}分`;
  }

  function bindClockPair(a,b,out,err){
    const calc=()=>{
      onlyDigits(a); onlyDigits(b);
      if(!a.value.trim()&&!b.value.trim()){out.textContent="0時間0分";err.textContent="";return}
      const s=parseClock(a.value), e=parseClock(b.value);
      if(s===undefined||e===undefined){out.textContent="—";err.textContent="時刻は0000〜2359の範囲で入力してください。";return}
      if(s===null||e===null){out.textContent="—";err.textContent="";return}
      out.textContent=formatMinutes(clockDiff(s,e));err.textContent="";
    };
    a.addEventListener("input",calc); b.addEventListener("input",calc);
  }

  bindClockPair(
    document.getElementById("start"),document.getElementById("end"),
    document.getElementById("diffResult"),document.getElementById("diffError")
  );
  bindClockPair(
    document.getElementById("overnightStart"),document.getElementById("overnightEnd"),
    document.getElementById("overnightResult"),document.getElementById("overnightError")
  );

  const rows=document.getElementById("rows");
  const sumResult=document.getElementById("sumResult");
  const sumError=document.getElementById("sumError");

  function parseDuration(value){
    const s=value.trim();
    if(!s) return 0;
    if(!/^\d+$/.test(s)) return null;
    const n=Number(s);
    if(!Number.isSafeInteger(n)) return null;
    if(s.length>=3){
      const h=Math.floor(n/100), m=n%100;
      if(m>=60) return null;
      return h*60+m;
    }
    return n;
  }

  function calculateSum(){
    let total=0,bad=false;
    rows.querySelectorAll(".duration").forEach(input=>{
      const v=parseDuration(input.value);
      if(input.value.trim() && v===null) bad=true;
      else total+=v;
    });
    sumResult.textContent=formatMinutes(total);
    sumError.textContent=bad?"110、030、50のように数字だけで入力してください（分は59まで）。":"";
  }

  function addRow(value=""){
    const row=document.createElement("div");
    row.className="row";
    row.innerHTML=`<input class="duration" inputmode="numeric" maxlength="6" placeholder="例：110" value="${value}"><button class="remove" type="button" aria-label="削除">×</button>`;
    rows.appendChild(row);
    const input=row.querySelector("input");
    input.addEventListener("input",()=>{onlyDigits(input);calculateSum()});
    row.querySelector(".remove").addEventListener("click",()=>{if(rows.children.length>1){row.remove();calculateSum()}});
    return input;
  }

  addRow(); addRow();
  document.getElementById("add").addEventListener("click",()=>addRow().focus());
  document.getElementById("clear").addEventListener("click",()=>{
    rows.innerHTML=""; addRow(); addRow(); calculateSum();
  });
  calculateSum();
})();
</script>
</body>
</html>
